name: Frontend checks
on: [push, pull_request]
jobs:
  checks:
    env:
      VITE_API_URL: https://api.elparaisohotelltd.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run check:seo
      - run: npm audit --audit-level=moderate

  windows-deployment-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path deploy/windows/Test-WindowsRelease.ps1), [ref]$Tokens, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count -gt 0) { throw ($ParseErrors | Out-String) }
